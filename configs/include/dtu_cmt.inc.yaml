---
# Hub-level entities of a hoymiles_dtu_cmt hub. Included through configs/dtu.yaml, once per
# hub.
# The scan entities stay empty unless scan_detection is enabled on the hub. There is no active
# scanner on this radio, so no scan_found_count / scan_result.
#
# vars:
#   dtu_id: id of the hoymiles_dtu_cmt hub
#   name:   entity name prefix, e.g. DTU
sensor:
  - platform: hoymiles_dtu_base
    dtu_id: ${dtu_id}
    scan_severity: {name: '${name} Scan Severity'}
text_sensor:
  - platform: hoymiles_dtu_base
    dtu_id: ${dtu_id}
    last_rx_payload: {name: '${name} Last RX Payload'}
    last_radio_error: {name: '${name} Last Radio Error'}
    scan_detected: {name: '${name} Scan Detected'}
