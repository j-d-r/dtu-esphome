---
# HM or HMS inverter with 1 DC input (HM-300/350/400, HMS-300/350/400/450/500, HMS-450/500 v2).
# vars: family (hm or hms, selects {family}_inverter_base.yaml), plus the vars of that base file.
packages:
  inverter_base: !include
    file: ${family}_inverter_base.yaml
    vars:
      dtu_id: ${dtu_id}
      inverter: ${inverter}
      name: ${name}
      serial: ${serial}
      model: ${model}
sensor:
  - platform: hoymiles_dtu_base
    inverter_id: ${inverter}
    channels:
      - number: 1
        dc_voltage: {name: '${name} CH1 DC Voltage'}
        dc_current: {name: '${name} CH1 DC Current'}
        dc_power: {name: '${name} CH1 DC Power'}
        yield_today: {name: '${name} CH1 Yield Today'}
