# HMS inverter with 4 DC inputs (HMS-1600/1800/2000). vars: see hms_inverter_base.yaml.

packages:
  hms_inverter_base: !include
    file: hms_inverter_base.yaml
    vars:
      dtu_id: ${dtu_id}
      inverter: ${inverter}
      name: ${name}
      serial: ${serial}
      model: ${model}

sensor:
  - platform: hoymiles_dtu_base
    inverter_id: ${inverter}
    channels:
      - number: 1
        dc_voltage: { name: "${name} CH1 DC Voltage" }
        dc_current: { name: "${name} CH1 DC Current" }
        dc_power: { name: "${name} CH1 DC Power" }
        yield_today: { name: "${name} CH1 Yield Today" }
      - number: 2
        dc_voltage: { name: "${name} CH2 DC Voltage" }
        dc_current: { name: "${name} CH2 DC Current" }
        dc_power: { name: "${name} CH2 DC Power" }
        yield_today: { name: "${name} CH2 Yield Today" }
      - number: 3
        dc_voltage: { name: "${name} CH3 DC Voltage" }
        dc_current: { name: "${name} CH3 DC Current" }
        dc_power: { name: "${name} CH3 DC Power" }
        yield_today: { name: "${name} CH3 Yield Today" }
      - number: 4
        dc_voltage: { name: "${name} CH4 DC Voltage" }
        dc_current: { name: "${name} CH4 DC Current" }
        dc_power: { name: "${name} CH4 DC Power" }
        yield_today: { name: "${name} CH4 Yield Today" }
